<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: mmd-asset:; connect-src 'self' ws://127.0.0.1:5173 mmd-asset:; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>soft hearts · 物理调参台</title>
    <style>
      :root { color-scheme: dark; --bg: #1b1d24; --panel: #23262f; --line: #343846; --text: #e7e8ee; --muted: #9aa0b2; --accent: #8fb8ff; --warn: #ffb27a; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
      #lab { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100%; }
      #view { position: relative; min-width: 0; }
      #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; pointer-events: none; }
      #overlay > * { pointer-events: auto; }
      #status { position: absolute; left: 10px; bottom: 10px; padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: var(--muted); white-space: pre; font: 12px/1.4 Consolas, monospace; }
      #side { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 12px 40px; }
      h2 { font-size: 14px; margin: 14px 0 6px; } h2:first-child { margin-top: 0; }
      .hint { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
      button, select { background: #2d313d; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); } button.on { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px; gap: 6px; align-items: center; margin: 2px 0; }
      .row input[type=range] { width: 100%; }
      .row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      .group { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
      .group > summary { cursor: pointer; }
      .group[open] > summary { margin-bottom: 4px; }
      .badge { display: inline-block; padding: 0 6px; border-radius: 8px; background: #383d4c; color: var(--muted); font-size: 11px; margin-left: 4px; }
      .badge.long { background: #4b3a2a; color: var(--warn); }
      table.numbers { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; }
      table.numbers th, table.numbers td { padding: 2px 4px; border-bottom: 1px solid var(--line); text-align: right; }
      table.numbers th:first-child, table.numbers td:first-child { text-align: left; }
      .bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
      .check { display: flex; gap: 6px; align-items: center; margin: 2px 0; }
      #notice { min-height: 18px; color: var(--accent); }
      #notice.error { color: var(--warn); }
    </style>
  </head>
  <body>
    <div id="lab">
      <div id="view"><div id="overlay"></div><div id="status"></div></div>
      <div id="side"></div>
    </div>
    <script type="module" src="./lab-main.ts"></script>
  </body>
</html>
